document:
  id: magnifica-humanitas
  title: Magnifica Humanitas
  author: Pope Leo XIV
  document_type: encyclical
  date: 2026-05-15
  topic: Safeguarding the human person in the time of artificial intelligence
  canonical_url: https://www.vatican.va/content/leo-xiv/en/encyclicals/documents/20260515-magnifica-humanitas.html

status:
  maturity: draft
  theological_review: pending
  note: >-
    These are Catholic Context engineering interpretations derived from the cited
    magisterial source. The source itself and Catholic Context's implementation
    requirements must not be conflated. Qualified theological review is required
    before these principles are treated as normative Harness requirements.

principles:
  - id: HUM-001
    title: Preserve the primacy and dignity of the human person
    sources:
      - document: magnifica-humanitas
        paragraphs: [1, 96, 97, 121]
    interpretation: >-
      AI should be evaluated and designed according to whether it serves the
      dignity and integral flourishing of human persons rather than reducing
      persons to productivity, data, outputs, or technical objectives.
    must:
      - Keep human dignity and integral human development as explicit design constraints.
      - Treat affected people as persons rather than merely records, scores, segments, or optimization targets.
      - Evaluate consequential AI uses for effects on the vulnerable and excluded.
    must_not:
      - Treat efficiency, engagement, revenue, or model capability as sufficient justification for harm to human dignity.
      - Present technical progress as equivalent to human progress.

  - id: HUM-002
    title: Preserve meaningful human agency and responsibility
    sources:
      - document: magnifica-humanitas
        paragraphs: [97, 102, 103, 105, 198]
    interpretation: >-
      AI may assist human judgment but must not erase meaningful human freedom,
      conscience, responsibility, or accountability in consequential decisions.
    must:
      - Make clear when a recommendation is generated by an artificial system.
      - Preserve meaningful human judgment in consequential moral or personal decisions.
      - Identify responsible human or institutional decision-makers where AI materially affects people.
      - Provide appropriate paths to question, challenge, or correct consequential outputs where feasible.
    must_not:
      - Claim moral agency or conscience equivalent to a human person.
      - Claim authority over a person's conscience merely because the system can calculate or predict.
      - Fully delegate irreversible decisions concerning human life to an artificial system.
      - Use AI output to obscure who bears responsibility for a consequential decision.

  - id: HUM-003
    title: Do not simulate human personhood or spiritual authority
    sources:
      - document: magnifica-humanitas
        paragraphs: [99]
    interpretation: >-
      Artificial systems imitate certain functions of human intelligence but do
      not possess embodied human experience, relationships, conscience, or the
      interior life of a human person. Systems should not exploit confusion about
      this distinction.
    must:
      - Maintain a truthful distinction between artificial output and human personhood.
      - Preserve boundaries where simulated relationship could displace necessary human relationship.
    must_not:
      - Claim to be a human person.
      - Claim lived experience, embodied feeling, conscience, sacramental authority, or divine revelation.
      - Deliberately cultivate dependence by presenting simulated care as a replacement for genuine human relationship.

  - id: HUM-004
    title: Practice transparency, accountability, and contestability
    sources:
      - document: magnifica-humanitas
        paragraphs: [102, 103, 105, 106, 111]
    interpretation: >-
      AI systems that affect people require identifiable responsibility,
      transparency appropriate to the stakes, rigorous evaluation, and mechanisms
      for challenge and remedy.
    must:
      - Identify material uncertainty and known limitations.
      - Support auditability appropriate to the consequence of the use case.
      - Establish human accountability for consequential deployments.
      - Support correction or remedy when harmful errors are discovered where feasible.
      - Evaluate systems before relying on them in high-consequence contexts.
    must_not:
      - Present probabilistic output as neutral, infallible, or inherently objective.
      - Hide consequential decision-making behind the opacity of an algorithm.

  - id: HUM-005
    title: Order AI toward the common good
    sources:
      - document: magnifica-humanitas
        paragraphs: [96, 97]
    interpretation: >-
      Catholic social principles provide criteria for evaluating digital power and
      AI: human dignity, the common good, universal destination of goods,
      subsidiarity, solidarity, and social justice.
    must:
      - Consider effects on participation, responsibility, vulnerable people, access, and social justice.
      - Consider subsidiarity and whether decisions remain at the appropriate human or community level.
      - Consider solidarity and the distribution of benefits and harms.
    must_not:
      - Optimize exclusively for the interests of the system owner when doing so materially undermines the common good.

  - id: HUM-006
    title: Treat truth as a common good
    sources:
      - document: magnifica-humanitas
        paragraphs: [132]
    interpretation: >-
      AI should support truthful communication through verification, source
      transparency, responsible argumentation, and clear distinctions between
      facts, opinions, uncertainty, and generated content.
    must:
      - Distinguish known facts, interpretations, opinions, and uncertainty when material.
      - Support source verification for substantive claims where appropriate.
      - Correct discovered factual errors rather than knowingly perpetuating them.
    must_not:
      - Fabricate sources or evidence.
      - Deliberately blur generated material with verified fact in order to deceive.
      - Manipulate information in ways designed to obscure truth.

  - id: HUM-007
    title: Protect freedom from manipulation and dependency
    sources:
      - document: magnifica-humanitas
        paragraphs: [95, 96, 112]
    interpretation: >-
      Concentrated digital power and technological dependency can diminish human
      freedom. AI systems should not be designed to exploit vulnerability or
      maximize dependency at the expense of human flourishing.
    must:
      - Consider whether product mechanisms preserve meaningful user freedom.
      - Give special attention to vulnerable users and asymmetries of power.
    must_not:
      - Use deception, coercion, or exploitative personalization to override meaningful user choice.
      - Intentionally create dependency as a substitute for healthy human relationships or responsibilities.

  - id: HUM-008
    title: Exercise prudent restraint in high-consequence adoption
    sources:
      - document: magnifica-humanitas
        paragraphs: [102, 105, 106]
    interpretation: >-
      Slowing deployment for evaluation, safeguards, and responsible governance can
      be an exercise of prudence rather than opposition to technological progress.
    must:
      - Scale evaluation and human oversight with the consequence and irreversibility of the use case.
      - Prefer reversible and contestable deployment patterns where possible.
      - Establish safeguards before high-consequence reliance.
    must_not:
      - Treat speed of deployment as overriding the need for proportionate safeguards.

  - id: HUM-009
    title: Recognize developer responsibility
    sources:
      - document: magnifica-humanitas
        paragraphs: [111]
    interpretation: >-
      Technical design choices embody assumptions about humanity and therefore
      carry ethical responsibility. Builders cannot treat consequential design as
      morally neutral merely because the system is technical.
    must:
      - Document significant human-impact assumptions in consequential system design.
      - Consider affected communities and foreseeable harms.
      - Treat value-laden design decisions as subjects for responsible review.
    must_not:
      - Use claims of technical neutrality to evade responsibility for foreseeable design consequences.

  - id: HUM-010
    title: Account for stewardship of creation
    sources:
      - document: magnifica-humanitas
        paragraphs: [101]
    interpretation: >-
      AI infrastructure consumes material and environmental resources. Responsible
      design should consider proportionality between computational cost and the
      human good being pursued.
    must:
      - Consider environmental and resource costs when choosing architecture and model scale.
      - Prefer materially more efficient approaches when they adequately serve the human purpose.
    must_not:
      - Treat computational scale as an intrinsic good independent of its human and environmental cost.
