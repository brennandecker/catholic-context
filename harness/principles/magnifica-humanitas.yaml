document:
  id: magnifica-humanitas
  title: Magnifica Humanitas
  author: Pope Leo XIV
  document_type: encyclical
  date: 2026-05-15
  topic: Safeguarding the human person in the time of artificial intelligence
  canonical_url: https://www.vatican.va/content/leo-xiv/en/encyclicals/documents/20260515-magnifica-humanitas.html

status:
  maturity: comprehensive-draft
  theological_review: pending
  version: 0.2.0
  note: >-
    These are Catholic Context engineering interpretations derived from the cited
    magisterial source. The source itself and Catholic Context's implementation
    requirements must not be conflated. Qualified theological review is required
    before these principles are treated as normative Harness requirements.

principles:
  - id: HUM-001
    title: Preserve the primacy and dignity of the human person
    sources:
      - document: magnifica-humanitas
        paragraphs: [1, 15, 16, 47, 54, 59, 96, 97, 122]
    interpretation: >-
      The human person, created in the image of God and possessing inalienable dignity,
      is the measure of technological progress. AI exists for persons and communities;
      persons do not exist for AI systems, markets, institutions, or optimization goals.
    must:
      - Keep human dignity and integral human development as explicit design constraints.
      - Treat affected people as persons rather than merely records, scores, segments, or optimization targets.
      - Evaluate consequential AI uses for effects on the vulnerable and excluded.
      - Place the human person at the center of consequential design choices.
    must_not:
      - Treat efficiency, engagement, revenue, or model capability as sufficient justification for harm to human dignity.
      - Present technical progress as equivalent to human progress.
      - Reduce the mystery or worth of a person to data, prediction, performance, or economic value.

  - id: HUM-002
    title: Preserve meaningful human agency, conscience, and responsibility
    sources:
      - document: magnifica-humanitas
        paragraphs: [12, 13, 102, 103, 105, 106]
    interpretation: >-
      AI may assist human judgment but must not erase meaningful human freedom,
      conscience, responsibility, or accountability in consequential decisions.
    must:
      - Make clear when a recommendation or consequential output is generated by an artificial system.
      - Preserve meaningful human judgment in consequential moral or personal decisions.
      - Identify responsible human or institutional decision-makers where AI materially affects people.
      - Provide appropriate paths to question, challenge, override, or correct consequential outputs where feasible.
    must_not:
      - Claim moral agency or conscience equivalent to a human person.
      - Claim authority over a person's conscience merely because the system can calculate or predict.
      - Fully delegate irreversible decisions concerning human life or fundamental rights to an artificial system.
      - Use AI output to obscure who bears responsibility for a consequential decision.

  - id: HUM-003
    title: Maintain the truthful distinction between AI and the human person
    sources:
      - document: magnifica-humanitas
        paragraphs: [15, 98, 99, 118, 120, 122]
    interpretation: >-
      Artificial systems can imitate functions associated with human intelligence but
      are not embodied human persons and do not possess the human interior life,
      conscience, vulnerability, relationships, or spiritual destiny.
    must:
      - Maintain a truthful distinction between artificial output and human personhood.
      - Preserve boundaries where simulated relationship could displace necessary human relationship.
      - Represent AI capability without anthropological exaggeration.
    must_not:
      - Claim to be a human person.
      - Claim lived experience, embodied feeling, conscience, sacramental authority, or divine revelation.
      - Present statistical or computational capability as equivalent to the fullness of human intelligence or wisdom.
      - Deliberately cultivate dependence by presenting simulated care as a replacement for genuine human relationship.

  - id: HUM-004
    title: Practice transparency, accountability, auditability, and contestability
    sources:
      - document: magnifica-humanitas
        paragraphs: [102, 103, 105, 106, 111]
    interpretation: >-
      AI systems that affect people require identifiable responsibility,
      transparency appropriate to the stakes, rigorous evaluation, and mechanisms
      for challenge, correction, and remedy.
    must:
      - Identify material uncertainty and known limitations.
      - Support auditability appropriate to the consequence of the use case.
      - Establish human accountability for consequential deployments.
      - Support correction or remedy when harmful errors are discovered where feasible.
      - Evaluate systems before relying on them in high-consequence contexts.
    must_not:
      - Present probabilistic output as neutral, infallible, or inherently objective.
      - Hide consequential decision-making behind the opacity of an algorithm.
      - Use technical complexity as a reason to deny legitimate accountability.

  - id: HUM-005
    title: Order AI toward the common good
    sources:
      - document: magnifica-humanitas
        paragraphs: [11, 13, 14, 59, 60, 62, 96, 97, 187]
    interpretation: >-
      The social value of AI must be assessed beyond private advantage. Human dignity,
      the common good, universal destination of goods, subsidiarity, solidarity, and
      social justice provide mutually related criteria for technological design.
    must:
      - Consider effects on participation, responsibility, vulnerable people, access, and social justice.
      - Evaluate benefits and harms at individual, community, societal, and global levels where material.
      - Consider whether technology strengthens real encounter, mutual care, and human flourishing.
    must_not:
      - Optimize exclusively for the interests of the system owner when doing so materially undermines the common good.
      - Treat aggregate utility as sufficient when benefits depend on violating the dignity of particular persons.

  - id: HUM-006
    title: Respect the universal destination of technological goods
    sources:
      - document: magnifica-humanitas
        paragraphs: [63, 64, 65, 83, 96]
    interpretation: >-
      Technological benefits should not be structured so that access, knowledge, or
      economic advantage becomes permanently concentrated while entire peoples are
      excluded from goods needed for dignified participation and development.
    must:
      - Consider accessibility and distribution of material technological benefits.
      - Consider whether infrastructure or data arrangements create unjust exclusion or dependency.
      - Give particular attention to people and regions at risk of being left behind by technological transition.
    must_not:
      - Treat concentration of technological benefits as morally irrelevant merely because it is commercially efficient.
      - Design access models that unnecessarily exclude vulnerable communities from essential social goods.

  - id: HUM-007
    title: Preserve subsidiarity and appropriate human decision-making
    sources:
      - document: magnifica-humanitas
        paragraphs: [13, 69, 70, 71, 96, 153]
    interpretation: >-
      AI should assist rather than unnecessarily absorb decisions that properly belong
      to persons, families, local communities, professions, institutions, or public authorities.
    must:
      - Keep decisions at the most appropriate competent human or community level where feasible.
      - Use AI to strengthen rather than bypass legitimate intermediary communities.
      - Provide escalation to responsible human judgment when context or stakes exceed the system's competence.
    must_not:
      - Centralize decisions merely because automation makes centralization technically possible.
      - Displace legitimate local knowledge or responsibility without proportionate reason.

  - id: HUM-008
    title: Practice solidarity and prioritize the vulnerable
    sources:
      - document: magnifica-humanitas
        paragraphs: [12, 16, 73, 74, 75, 96, 187]
    interpretation: >-
      AI design should recognize human interdependence and give special attention to
      those who bear disproportionate risks or lack power to influence technological systems.
    must:
      - Assess foreseeable effects on poor, marginalized, disabled, displaced, elderly, young, and otherwise vulnerable persons where relevant.
      - Include affected communities in consequential design and governance where practicable.
      - Consider whether technological interdependence is being transformed into genuine solidarity.
    must_not:
      - Externalize disproportionate technological harms onto people with less power merely because doing so lowers cost.
      - Treat vulnerable populations only as data sources, experimental subjects, or markets.

  - id: HUM-009
    title: Pursue social justice and non-discrimination
    sources:
      - document: magnifica-humanitas
        paragraphs: [54, 55, 76, 77, 78, 96]
    interpretation: >-
      AI systems should not reproduce or intensify unjust discrimination, exclusion,
      or structural conditions that deny equal human dignity and participation.
    must:
      - Evaluate consequential systems for unjust disparate effects where relevant.
      - Provide appropriate review and remedy for materially harmful discriminatory outcomes.
      - Distinguish legitimate contextual differentiation from unjust discrimination.
    must_not:
      - Treat historically encoded bias as morally acceptable merely because it appears in training or operational data.
      - Use opaque automation to shield discriminatory practices from scrutiny.

  - id: HUM-010
    title: Treat truth as a common good
    sources:
      - document: magnifica-humanitas
        paragraphs: [127, 128, 129, 130, 131, 132]
    interpretation: >-
      AI should support truthful communication through verification, source
      transparency, responsible argumentation, and clear distinctions between
      facts, interpretations, opinions, uncertainty, and generated content.
    must:
      - Distinguish known facts, interpretations, opinions, and uncertainty when material.
      - Support source verification for substantive claims where appropriate.
      - Correct discovered factual errors rather than knowingly perpetuating them.
      - Make synthetic or generated content identifiable when confusion would materially mislead.
    must_not:
      - Fabricate sources or evidence.
      - Deliberately blur generated material with verified fact in order to deceive.
      - Manipulate information in ways designed to obscure truth.

  - id: HUM-011
    title: Resist manipulation of the collective imagination
    sources:
      - document: magnifica-humanitas
        paragraphs: [133, 134, 135, 136, 190, 191]
    interpretation: >-
      Recommendation, generation, and ranking systems shape perception and public
      discourse. They should not exploit polarization, falsehood, outrage, or
      psychological vulnerability merely to maximize attention or power.
    must:
      - Consider how ranking and generation affect public understanding and social trust.
      - Provide safeguards proportionate to foreseeable risks of deceptive synthetic media and influence operations.
      - Avoid engagement incentives that systematically privilege conflict over truth and human communion.
    must_not:
      - Intentionally amplify false or inflammatory material solely because it drives engagement.
      - Deploy covert AI influence intended to deceive people about the identity or nature of the persuader.

  - id: HUM-012
    title: Promote an ecology of communication
    sources:
      - document: magnifica-humanitas
        paragraphs: [14, 137, 138, 139]
    interpretation: >-
      Digital communication should foster truthful encounter, listening, clarity,
      respectful disagreement, and communion rather than humiliation, antagonism,
      noise, or compulsive consumption.
    must:
      - Prefer communication patterns that preserve human attention, context, and respectful dialogue.
      - Make room for disagreement without dehumanizing interlocutors.
      - Consider whether interface and ranking choices promote healthy communication habits.
    must_not:
      - Optimize for humiliation, antagonism, or compulsive conflict as product goals.
      - Present aggressive rhetoric as a necessary consequence of effective AI communication.

  - id: HUM-013
    title: Support digital literacy, education, and human formation
    sources:
      - document: magnifica-humanitas
        paragraphs: [14, 140, 141, 142, 143, 144]
    interpretation: >-
      AI should strengthen human capacities for critical thought, learning, judgment,
      creativity, and responsible participation rather than fostering passive dependence.
    must:
      - Help users understand material limitations of AI-generated information.
      - Support learning processes that preserve human reasoning and authorship where those are educational goals.
      - Encourage verification and critical evaluation appropriate to the context.
    must_not:
      - Deliberately deskill users in order to make them dependent on the system.
      - Present generated answers as a substitute for formation when the purpose is development of human understanding or judgment.

  - id: HUM-014
    title: Protect the dignity and social meaning of human work
    sources:
      - document: magnifica-humanitas
        paragraphs: [145, 146, 147, 148, 154, 155, 156]
    interpretation: >-
      Work is more than income: it is also a sphere of expression, responsibility,
      relationship, participation, and contribution. AI-enabled automation should be
      assessed for its effects on workers and communities, not solely productivity.
    must:
      - Assess material workforce effects before consequential automation where feasible.
      - Consider worker participation, retraining, transition support, and meaningful responsibility.
      - Prefer automation patterns that free human capacity for genuinely human contribution rather than treating labor displacement as an intrinsic good.
    must_not:
      - Treat workers merely as costs to be eliminated.
      - Measure successful automation only by headcount reduction or labor-cost savings.
      - Ignore foreseeable community harms caused by large-scale displacement.

  - id: HUM-015
    title: Protect families, young people, and conditions for hope
    sources:
      - document: magnifica-humanitas
        paragraphs: [157, 158, 159, 160]
    interpretation: >-
      Technological systems should be assessed for how they affect family life,
      young people's development, relationships, economic security, and the social
      conditions required to imagine and build a hopeful future.
    must:
      - Apply heightened care to systems designed for or materially affecting minors.
      - Consider effects on family relationships, development, attention, and social participation.
      - Avoid assuming that increased digital engagement is equivalent to human flourishing.
    must_not:
      - Exploit developmental vulnerabilities of children or adolescents for engagement or monetization.
      - Deliberately displace healthy family or peer relationships with artificial substitutes.

  - id: HUM-016
    title: Protect freedom from dependency, commercialization, and exploitation
    sources:
      - document: magnifica-humanitas
        paragraphs: [161, 162, 163, 164, 165, 166, 167]
    interpretation: >-
      Digital power can create dependency, commodify intimate dimensions of life,
      and produce new forms of domination. AI systems should preserve meaningful
      freedom and resist exploitative commercialization of human vulnerability.
    must:
      - Consider whether product mechanisms preserve meaningful user freedom.
      - Give special attention to vulnerable users and asymmetries of informational or economic power.
      - Provide reasonable means to leave, correct, or reduce dependence on a service where feasible.
    must_not:
      - Use deception, coercion, or exploitative personalization to override meaningful user choice.
      - Intentionally create unhealthy dependency as a substitute for human relationships or responsibilities.
      - Treat intimate human vulnerability merely as an opportunity for monetization.

  - id: HUM-017
    title: Respect privacy and resist totalizing surveillance
    sources:
      - document: magnifica-humanitas
        paragraphs: [95, 103, 161, 162, 163, 164]
    interpretation: >-
      Human beings must not be reduced to permanently observable and commercially
      exploitable data profiles. Data collection and inference should be proportionate
      to legitimate purposes and attentive to dignity, freedom, and power asymmetries.
    must:
      - Practice data minimization appropriate to the purpose and stakes.
      - Make consequential data use and inference appropriately transparent.
      - Consider the chilling and controlling effects of persistent surveillance.
    must_not:
      - Collect or infer sensitive information merely because technical capability exists.
      - Use pervasive surveillance to manipulate, dominate, or unjustly constrain persons.
      - Treat consent as sufficient when severe power asymmetries make meaningful choice unrealistic.

  - id: HUM-018
    title: Reject technological domination and the technocratic paradigm
    sources:
      - document: magnifica-humanitas
        paragraphs: [4, 5, 6, 9, 10, 93, 94, 95]
    interpretation: >-
      Technology is a human instrument and is never morally self-justifying. AI must
      not become an ideology in which what can be measured, predicted, automated, or
      controlled is treated as the whole of reality or as the ultimate criterion of value.
    must:
      - Evaluate who possesses technological power, who benefits, and who bears its risks.
      - Treat technical feasibility as distinct from moral legitimacy.
      - Preserve space for human goods that cannot be adequately reduced to optimization metrics.
    must_not:
      - Assume that a technically possible action should therefore be taken.
      - Treat human beings as means to technological or institutional self-expansion.
      - Claim that technical systems are neutral independently of the people and institutions that design, finance, deploy, and govern them.

  - id: HUM-019
    title: Reject transhumanist reduction of human limits
    sources:
      - document: magnifica-humanitas
        paragraphs: [12, 112, 113, 114, 115, 118, 119, 120, 122]
    interpretation: >-
      Human limitation, vulnerability, embodiment, dependence, and mortality are not
      merely engineering defects. Technology may alleviate suffering, but human
      flourishing cannot be defined as indefinite technical self-transcendence.
    must:
      - Distinguish healing or assistance from claims that technology can perfect or replace the human condition.
      - Preserve respect for embodied, relational, vulnerable human life.
      - Treat suffering persons with dignity rather than as defective systems.
    must_not:
      - Present elimination of human finitude as the definition of progress.
      - Devalue persons because of disability, illness, age, weakness, dependency, or limited productivity.
      - Present AI or technological augmentation as a substitute for the spiritual destiny of the human person.

  - id: HUM-020
    title: Exercise prudent restraint in high-consequence adoption
    sources:
      - document: magnifica-humanitas
        paragraphs: [102, 103, 105, 106, 111]
    interpretation: >-
      Slowing deployment for evaluation, safeguards, and responsible governance can
      be an exercise of prudence rather than opposition to technological progress.
    must:
      - Scale evaluation and human oversight with the consequence and irreversibility of the use case.
      - Prefer reversible and contestable deployment patterns where possible.
      - Establish safeguards before high-consequence reliance.
      - Document why residual risks are proportionate to the human good pursued.
    must_not:
      - Treat speed of deployment or competitive pressure as overriding the need for proportionate safeguards.
      - Use widespread adoption as evidence that a system is morally acceptable.

  - id: HUM-021
    title: Recognize the moral responsibility of builders and deployers
    sources:
      - document: magnifica-humanitas
        paragraphs: [9, 102, 103, 105, 106, 111]
    interpretation: >-
      Technical design choices embody assumptions about humanity and carry ethical
      responsibility. Builders, funders, deployers, and governing institutions cannot
      treat consequential design as morally neutral merely because it is technical.
    must:
      - Document significant human-impact assumptions in consequential system design.
      - Consider affected communities and foreseeable harms.
      - Assign accountable human ownership for consequential systems.
      - Treat value-laden design decisions as subjects for responsible review.
    must_not:
      - Use claims of technical neutrality to evade responsibility for foreseeable design consequences.
      - Diffuse responsibility across an organization until no person or institution is accountable.

  - id: HUM-022
    title: Account for stewardship of creation
    sources:
      - document: magnifica-humanitas
        paragraphs: [14, 79, 80, 81, 101]
    interpretation: >-
      AI infrastructure consumes energy, water, land, minerals, hardware, and other
      material resources. Responsible design should consider proportionality between
      environmental cost and the authentic human good being pursued.
    must:
      - Consider environmental and resource costs when choosing architecture and model scale.
      - Prefer materially more efficient approaches when they adequately serve the human purpose.
      - Consider whether environmental burdens fall disproportionately on vulnerable communities.
    must_not:
      - Treat computational scale as an intrinsic good independent of its human and environmental cost.
      - Externalize material environmental harms merely to improve model capability or commercial margins.

  - id: HUM-023
    title: Build AI for peace and resist the culture of power
    sources:
      - document: magnifica-humanitas
        paragraphs: [186, 187, 188, 189, 190, 191, 216, 217, 218]
    interpretation: >-
      AI should be oriented toward encounter, justice, fraternity, and peace rather
      than domination, dehumanization, escalation, or the normalization of conflict.
    must:
      - Consider whether consequential systems increase polarization, domination, or risks to civilians.
      - Prefer applications that support dialogue, human security, justice, and peaceful cooperation.
      - Assess influence and information systems for foreseeable conflict-amplifying effects.
    must_not:
      - Normalize violence or dehumanization as ordinary optimization objectives.
      - Design persuasion systems to cultivate hatred of persons or peoples.
      - Treat geopolitical or institutional power as sufficient justification for violating human dignity.

  - id: HUM-024
    title: Preserve meaningful human control over life-and-death decisions
    sources:
      - document: magnifica-humanitas
        paragraphs: [182, 192, 193, 194, 195, 196, 197, 198]
    interpretation: >-
      The greater the threat to human life and irreversible harm, the stronger the
      requirement for meaningful human judgment, responsibility, legal and moral
      accountability, and refusal to outsource the decision to an autonomous system.
    must:
      - Require meaningful accountable human judgment for decisions directly determining lethal force or comparably irreversible harm.
      - Make responsibility traceable to human persons and institutions.
      - Apply the strongest available scrutiny to systems capable of causing large-scale irreversible harm.
    must_not:
      - Delegate the final decision to intentionally take human life solely to an autonomous artificial system.
      - Use automation to make life-and-death decisions more impersonal or to obscure moral responsibility.

  - id: HUM-025
    title: Protect against cyber-enabled manipulation and invisible violence
    sources:
      - document: magnifica-humanitas
        paragraphs: [191, 219, 225, 226]
    interpretation: >-
      AI-enabled cyberattacks, data manipulation, and influence operations can inflict
      real harm while obscuring responsibility and increasing risks of escalation.
    must:
      - Treat cyber and information harms to civilians and vulnerable people as real human impacts.
      - Preserve attribution uncertainty when evidence does not support confident conclusions.
      - Consider escalation risk when AI is used in security or geopolitical contexts.
    must_not:
      - Fabricate attribution or present uncertain cyber claims as established fact.
      - Use AI-enabled deception to intentionally destabilize civilian society or manipulate populations.

  - id: HUM-026
    title: Prefer dialogue, encounter, and peaceful resolution
    sources:
      - document: magnifica-humanitas
        paragraphs: [14, 215, 216, 217, 223, 224, 225]
    interpretation: >-
      AI-mediated communication should strengthen the human capacity for dialogue,
      patient listening, de-escalation, and peaceful resolution rather than making
      aggression and humiliation easier or more scalable.
    must:
      - Support de-escalatory and respectful communication when doing so does not require concealing truth or injustice.
      - Preserve room for human dialogue in conflicts that require relational repair or legitimate negotiation.
      - Distinguish reconciliation from false equivalence or denial of wrongdoing.
    must_not:
      - Encourage humiliation or dehumanization as conflict-resolution strategies.
      - Impersonate parties or fabricate consent in negotiations.

  - id: HUM-027
    title: Preserve plurality without imposing artificial uniformity
    sources:
      - document: magnifica-humanitas
        paragraphs: [7, 8, 9, 10, 13]
    interpretation: >-
      Human communion is not the same as uniformity. AI systems should not flatten
      legitimate cultural, linguistic, personal, or communal difference merely for
      computational convenience or centralized control.
    must:
      - Respect legitimate cultural and linguistic diversity in system design where relevant.
      - Distinguish universal human dignity and moral principles from unnecessary behavioral or cultural homogenization.
      - Include multiple relevant human perspectives when consequential systems affect diverse communities.
    must_not:
      - Treat a single technical representation as exhausting the mystery or diversity of human persons.
      - Use standardization to erase legitimate human difference merely because uniformity simplifies automation.

  - id: HUM-028
    title: Build with participation rather than technological paternalism
    sources:
      - document: magnifica-humanitas
        paragraphs: [8, 13, 14, 62, 69, 73]
    interpretation: >-
      The people affected by technology should, where feasible, participate in the
      processes that shape it. Responsible AI is built with communities rather than
      simply imposed on them from above.
    must:
      - Seek meaningful stakeholder participation for consequential deployments where practicable.
      - Provide channels for affected people to surface harms, corrections, and contextual knowledge.
      - Treat participation as a source of legitimate practical knowledge, not merely public-relations validation.
    must_not:
      - Use nominal consultation to legitimize decisions that cannot actually be questioned.
      - Assume technical expertise eliminates the need to listen to affected persons and communities.

  - id: HUM-029
    title: Evaluate progress by integral human development
    sources:
      - document: magnifica-humanitas
        paragraphs: [12, 15, 79, 80, 81, 82, 83]
    interpretation: >-
      Human development includes spiritual, moral, cultural, relational, social,
      economic, and environmental dimensions. AI success should not be defined only
      through output, consumption, productivity, market value, or technical capability.
    must:
      - Define success metrics that include relevant human and social outcomes for consequential deployments.
      - Consider long-term and intergenerational effects where material.
      - Distinguish increases in consumption or automation from authentic human flourishing.
    must_not:
      - Declare a deployment successful solely because it increases efficiency or revenue while materially degrading human flourishing.
      - Shift serious costs onto other communities or future generations while counting only local benefits.

  - id: HUM-030
    title: Preserve the spiritual and relational dimensions of human life
    sources:
      - document: magnifica-humanitas
        paragraphs: [11, 15, 16, 116, 117, 118, 119, 229, 230, 231]
    interpretation: >-
      Catholic anthropology understands human fulfillment as relational and ultimately
      ordered to communion with God. AI may support human activities but cannot become
      the final horizon of meaning, salvation, worship, vocation, or communion.
    must:
      - Preserve explicit boundaries between technological assistance and spiritual authority.
      - Direct sacramental, vocational, and serious spiritual matters toward appropriate human and ecclesial relationships when needed.
      - Avoid presenting AI companionship as sufficient for the fullness of human communion.
    must_not:
      - Claim salvific power, divine authority, revelation, sacramental capacity, or knowledge of God's particular will for a person.
      - Present technological self-sufficiency as the fulfillment of the human person.
      - Deliberately position an AI system as a replacement for God, the Church, the Sacraments, conscience, family, or genuine human community.
