# DRAFT — theological review pending
id: relic.st-therese
title: Relics of St. Thérèse of Lisieux
entity_type: devotion
classification:
  claim_type: historical-claim
  certainty: provisional
  note: >-
    The bones and other first-class relics kept at Lisieux, and those sent on pilgrimage
    in a sealed reliquary, are treated by the Church as relics of the canonized saint.
    This draft does not inventory every fragment.
summary: >-
  First-class relics. St. Thérèse of the Child Jesus died at the Lisieux Carmel in 1897
  and was canonized in 1925. Her bones are kept at Lisieux and have been carried in
  pilgrimage to many dioceses in a sealed reliquary. Those remains are significant,
  first-class relics: they are parts of her body. The tours are a modern form of an old
  instinct, that the communion of saints is not only an idea. A visiting reliquary is
  not a substitute for the Eucharist, and it is not a charm. It is a chance to ask the
  Little Flower to pray, and to remember that the body the Church buries is destined
  for glory.
