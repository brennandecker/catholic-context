id: relic.crown-of-thorns
title: The Crown of Thorns
entity_type: devotion
classification:
  claim_type: historical-claim
  certainty: provisional
  note: >-
    The object now kept at Notre-Dame de Paris has a continuous medieval custody from
    Constantinople to Louis IX (1239) to the Sainte-Chapelle and then to the cathedral.
    Whether every circlet in that object is from the Passion is a historical question.
    This draft records the shrine and the class, not a scientific demonstration.
summary: >-
  First-class relic of the Passion, in popular catechesis. The Gospels say the soldiers
  wove a crown of thorns and placed it on Jesus. A relic honored as that crown was
  brought from Constantinople to Paris in 1239 by St. Louis IX, who built the
  Sainte-Chapelle to house it. It later passed to Notre-Dame, was carried out of the
  2019 fire, and has been returned to the restored cathedral. The Church venerates it
  as a sign of Christ's mockery and kingship. Like other Passion relics, it is treated
  as first-class not because it is a saint's bone, but because it is honored as an
  instrument of the Lord's suffering. Public veneration still depends on ecclesiastical
  custody and should not slide into superstition.
