# DRAFT — theological review pending
id: relic.brandea
title: Brandea and cloths from the tombs of the saints
entity_type: devotion
classification:
  claim_type: historical-claim
  certainty: provisional
  note: >-
    Brandea are the ancient form of what parish catechesis now calls third-class relics.
    This entry is about the practice, not one surviving cloth.
summary: >-
  Third-class relics, in popular catechesis. In early Rome the Church was reluctant to
  divide the bodies of the apostles. Gregory the Great wrote to the Empress Constantina
  that instead of sending a bodily relic, the Romans were accustomed to lower a cloth
  to the tomb and then send that cloth, called a brandeum, as a relic. The 2001 Directory
  still names, as relics, objects that have touched the bodies or tombs of the saints,
  such as oils, cloths, and images. That is the ancestor of the small third-class cloth
  given at a shrine today. The honor is the same kind of honor: not worship of fabric,
  but veneration that passes to the saint and to God. A brandeum without a serious
  claim of contact and without ecclesiastical recognition is only a piece of cloth.
