# DRAFT — theological review pending
id: relic.st-francis-habit
title: Habit of St. Francis of Assisi
entity_type: devotion
classification:
  claim_type: historical-claim
  certainty: provisional
  note: >-
    Clothing the saint wore is a second-class relic. More than one tunic at Assisi and
    elsewhere is attributed to Francis; this draft names the class and the Assisi
    custody, not a thread-by-thread authentication of every garment.
summary: >-
  Second-class relic. The 2001 Directory counts as relics not only bodies, but objects
  that belonged to the saints, including clothes. A habit worn by St. Francis is that
  kind of relic: it touched his person in life, but it is not part of his body. Tunics
  attributed to him are kept at the Sacro Convento in Assisi and in related Franciscan
  houses. They speak the same poverty he preached. Veneration of the habit is veneration
  of the saint, and through him of Christ. It is not worship of cloth. As with every
  relic set out for the faithful, authenticity should be certified, and the object
  should not be sold or treated as a charm.
