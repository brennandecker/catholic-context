# DRAFT — theological review pending
id: relic.st-pio
title: Body of St. Pio of Pietrelcina
entity_type: devotion
classification:
  claim_type: historical-claim
  certainty: provisional
  note: >-
    The body exposed at San Giovanni Rotondo after the 2008 recognition is the saint's
    body as identified by the Church. This draft records the class and the shrine, not
    a medical narrative of the stigmata.
summary: >-
  First-class relic. St. Pio of Pietrelcina (Padre Pio) is buried at the sanctuary in
  San Giovanni Rotondo. After a canonical recognition in 2008, his body was placed
  where pilgrims can see it. An entire body of a canonized saint is a significant,
  first-class relic. People who come there often come because they know the story of
  the stigmata and of confession. The relic does not replace those facts, and it does
  not work as a charm. It is the body of a priest the Church has named a saint, kept
  for veneration and for prayer, under the same rules that govern every public relic:
  authenticity, no sale, no superstition, and no placing of the relic on the altar
  mensa reserved for the Eucharist.
