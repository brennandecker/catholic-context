# DRAFT — theological review pending
id: relic.true-cross
title: Relics of the True Cross
entity_type: devotion
classification:
  claim_type: historical-claim
  certainty: disputed
  note: >-
    The Church liturgically exalts the Cross and has long venerated fragments said to
    be of the wood on which Christ died. The authenticity of any given fragment is a
    historical question and is often uncertain. This draft does not authenticate a
    particular piece.
summary: >-
  First-class relics of the Passion, in popular catechesis. From late antiquity the
  Church has honored fragments believed to be of the Cross found in Jerusalem and
  associated, in Christian memory, with St. Helena. Major pieces have been kept at
  Santa Croce in Gerusalemme in Rome and in many other churches. The liturgical feast
  of the Exaltation of the Holy Cross (14 September) venerates the saving work of
  Christ, not a laboratory certificate for each sliver. Because so many fragments
  circulate, and because medieval piety sometimes multiplied them, a particular relic
  of the Cross should be received only with an ecclesiastical certificate, and doubtful
  pieces should be withdrawn. Even a genuine fragment is not a charm. It is a sign of
  the one sacrifice of the Lord.
