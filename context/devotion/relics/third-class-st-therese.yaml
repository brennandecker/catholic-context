# DRAFT — theological review pending
id: relic.third-class-st-therese
title: Third-class relics of St. Thérèse of Lisieux
entity_type: devotion
classification:
  claim_type: devotional-practice
  certainty: not-applicable
  note: >-
    This entry describes a common contemporary practice, not one unique cloth. A
    particular square of fabric is a relic only if it has actually been touched to an
    authentic relic and is recognized as such.
summary: >-
  Third-class relics. Many parishes and Carmels give small pieces of cloth that have
  been touched to a first-class relic of St. Thérèse, often with a simple certificate.
  The 2001 Directory includes, among relics, objects that have touched the saints'
  bodies or tombs. That is the class an OCIA tour means by "third class." No one of
  these cloths is a famous object in its own right. The point is the contact, and the
  prayer. A third-class relic of Thérèse is not a weaker saint. It is a smaller sign
  of the same communion. It must not be sold, collected as a trophy, or used as a
  charm. If the certificate is missing or the story is vague, it should be treated as
  an ordinary keepsake, not exposed for public veneration.
