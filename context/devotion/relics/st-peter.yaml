id: relic.st-peter
title: Relics of St. Peter in the Vatican
entity_type: devotion
classification:
  claim_type: historical-claim
  certainty: provisional
  note: >-
    The Church honors remains beneath the Vatican basilica as relics of the Apostle.
    Paul VI announced that identification in 1968 as a judgment he believed convincing,
    while saying research and discussion would continue. This entry is a draft historical
    summary, not a closed archaeological verdict.
summary: >-
  First-class relics. Beneath the high altar of St. Peter's Basilica, excavations begun
  under Pius XII uncovered a second-century tropaion and a tomb the Church takes to be
  Peter's. In a Christmas address of 1950, Pius XII said the tomb had been found and left
  the question of the bones open. On 26 June 1968, Paul VI told a general audience that
  patient investigation had identified, in a manner he believed convincing, mortal remains
  of the Prince of the Apostles, few but sacred, while admitting that research and
  controversy would not end. Those remains are first-class relics if the identification
  holds: they are part of a saint's body. Catholic veneration here is ordered to the
  confession of Peter and to the resurrection, not to a museum claim that every scholar
  must accept.
