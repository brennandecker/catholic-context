id: relic.st-bernadette
title: Body of St. Bernadette Soubirous
entity_type: devotion
classification:
  claim_type: historical-claim
  certainty: provisional
  note: >-
    The body at Nevers is the saint's body, publicly identified by the Church after
    canonical recognitions. "Incorrupt" is a descriptive report from those recognitions,
    not a separate dogma.
summary: >-
  First-class relic. The body of St. Bernadette, the visionary of Lourdes, is kept in
  a glass reliquary in the chapel of the former convent of Saint-Gildard at Nevers,
  France, where she lived as a Sister of Charity. Canonical recognitions in 1909, 1919,
  and 1925 identified the body and described it as remarkably preserved. An entire body,
  or a notable part of a body, is what the 2001 Directory and the 2017 instruction call
  a significant relic, and what parish catechesis calls first-class. Pilgrims who kneel
  there are not worshipping Bernadette. They are asking the girl of Lourdes to pray, and
  they are looking at a body the Church believes will rise.
