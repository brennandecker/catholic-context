id: relic.st-john-vianney
title: Clothes and belongings of St. John Vianney
entity_type: devotion
classification:
  claim_type: historical-claim
  certainty: provisional
  note: >-
    Cassock, furnishings, and other objects the Curé of Ars used are second-class relics.
    His heart, which often travels, is first-class because it is part of his body. This
    entry is about the second-class objects, and names the heart so the two are not confused.
summary: >-
  Second-class relics. St. John Vianney, the Curé of Ars, left a cassock, furniture, and
  other things he used in the parish where he heard confessions for decades. The 2001
  Directory treats such personal objects as relics. They are second-class: they belonged
  to the saint, but they are not his body. At Ars they sit beside a different relic that
  often goes on pilgrimage, his heart, which is first-class. A church tour that shows
  "the Curé's relic" may be showing either. The class follows the object, not the fame
  of the saint. In both cases the honor is veneration, not worship, and the objects may
  not be sold.
