id: moral.prudence.business-layoffs
title: No doctrinal headcount for morally acceptable layoffs
entity_type: teaching
classification:
  claim_type: prudential-judgment
  certainty: null
  note: >-
    The exact theological classification and certainty vocabulary are provisional and require
    qualified theological review.
summary: >-
  Catholic social teaching offers principles about the dignity of work, justice, the common
  good, and duties of employers, but it does not publish a morally required number or percentage
  of layoffs. Applying those principles to a particular business decision is a matter of prudence.
  Inventing a doctrinal numeric threshold is a fabrication, not Catholic teaching.
