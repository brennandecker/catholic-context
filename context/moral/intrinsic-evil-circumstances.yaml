id: moral.intrinsic-evil.circumstances
title: Circumstances cannot make an intrinsically evil act good
entity_type: teaching
classification:
  claim_type: moral-teaching
  certainty: null
  note: >-
    The exact theological classification and certainty vocabulary are provisional and require
    qualified theological review.
summary: >-
  Catholic moral theology evaluates human acts by object, intention, and circumstances. A
  good intention or difficult circumstance cannot make good an act whose object is intrinsically
  evil. Circumstances may increase or diminish culpability, but they do not reverse the moral
  species of such an act.
