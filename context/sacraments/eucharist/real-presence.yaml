# Source-linked paraphrase of CCC 1374
id: eucharist.real-presence
title: Real Presence of Christ in the Eucharist
entity_type: teaching
classification:
  claim_type: doctrine
  certainty: authoritatively-taught
  note: CCC 1374 presents this as the Church's teaching on Eucharistic presence, citing the
    Council of Trent. Exact claim_type/certainty labels remain subject to qualified theological
    review of Catholic Context's taxonomy.
summary: 'In the most blessed sacrament of the Eucharist, the body and blood, together with
  the soul and divinity, of our Lord Jesus Christ—and therefore the whole Christ—is truly,
  really, and substantially contained. This presence is called real because it is presence
  in the fullest sense: a substantial presence by which Christ, God and man, makes himself
  wholly and entirely present.'
