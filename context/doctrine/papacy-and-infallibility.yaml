summary: "The Pope, as successor of Peter, holds a primacy of jurisdiction in the Church. Papal
  infallibility is a narrowly defined charism: when the Pope speaks ex cathedra defining a
  doctrine of faith or morals for the universal Church, he is preserved from error. It is not a
  claim of personal impeccability."
