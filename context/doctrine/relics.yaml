# DRAFT — theological review pending
id: doctrine.relics
title: Relics of the Saints
entity_type: teaching
classification:
  claim_type: doctrine
  certainty: null
  note: >-
    Veneration of authentic relics is conciliar and catechetical teaching. The popular
    first-, second-, and third-class labels are a pastoral sorting of that practice, not
    a defined ranking of holiness. Classification vocabulary here is provisional and
    requires qualified theological review.
summary: >-
  The Church venerates authentic relics of the saints because their bodies were, on
  earth, living temples of the Holy Spirit and instruments of holiness, and are destined
  for resurrection. This honor is relative to Christ. It is not worship, which is due to
  God alone. Parish catechesis often sorts relics into three classes: first class, a body
  or notable part of a body, or an instrument of the Lord's Passion; second class, an
  object the saint used or owned; and third class, an object that has touched a body,
  a tomb, or another relic. Recent Roman documents speak in a closely related way of
  significant relics and non-significant relics, and they require a certificate of
  authenticity before relics are set out for public veneration. The sale of relics is
  forbidden. Doubtful relics are to be withdrawn with pastoral prudence, and relics
  must not be treated as charms or placed on the altar mensa reserved for the Eucharist.
