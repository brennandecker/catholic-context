notes: |
  Draft for inquirers who meet relics on a church tour. The numbered classes are a
  teaching aid. They do not mean a first-class relic is "more holy" than a third-class
  one. Holiness is the saint's, and the honor given to a relic is meant to pass to
  God who made the saint holy.

  Instruments of the Passion (a fragment of the Cross, the Crown of Thorns) are treated
  in popular catechesis as first-class relics of the Lord. The 2017 instruction is
  written for relics of blesseds and saints, so those Passion objects are related by
  analogy, not by that document's legal categories.

  Presence here does not imply ecclesiastical approval of this wording or completed
  theological review.
