sources:
  - source_type: scripture
    reference: 2 Kings 13:21
    url: null
    note: >-
      A dead man is raised after touching the bones of Elisha. The Church reads this as
      a scriptural witness that God may act through the remains of the holy, not as a
      proof that every relic works a miracle.
  - source_type: scripture
    reference: Acts 19:11-12
    url: null
    note: >-
      Cloths that had touched Paul are carried to the sick. This is the biblical pattern
      later named, in popular speech, a third-class relic.
  - source_type: ecumenical-council
    reference: >-
      Council of Trent, Session 25 (3 December 1563), Decree on Invocation, Veneration,
      and Relics of Saints, and on Sacred Images
    url: null
    note: >-
      The Council defends the veneration of relics and condemns those who deny it, while
      rejecting superstition and the seeking of filthy lucre.
  - source_type: ecumenical-council
    reference: Sacrosanctum Concilium 111
    url: >-
      https://www.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_const_19631204_sacrosanctum-concilium_en.html
    note: >-
      Vatican II repeats that the saints are honored in the Church and that their authentic
      relics and images are held in veneration.
  - source_type: catechism
    reference: CCC 828, 1674-1676
    url: https://www.vatican.va/archive/ENG0015/_INDEX.HTM
    note: >-
      Canonization, authentic relics, and relics among the forms of popular piety that
      surround the sacramental life without replacing the liturgy.
  - source_type: magisterium
    reference: Directory on Popular Piety and the Liturgy 236-237 (17 December 2001)
    url: >-
      https://www.vatican.va/roman_curia/congregations/ccdds/documents/rc_con_ccdds_doc_20020513_vers-direttorio_en.html
    note: >-
      Names bodies or notable parts, objects that belonged to the saints, and objects
      that have touched their bodies or tombs. Requires authenticity, forbids trafficking
      and superstition, and keeps relics off the altar mensa.
  - source_type: magisterium
    reference: >-
      Congregation for the Causes of Saints, Instruction Relics in the Church
      Authenticity and Preservation (8 December 2017)
    url: >-
      https://www.vatican.va/roman_curia/congregations/csaints/documents/rc_con_csaints_doc_20171208_istruzione-reliquie_en.html
    note: >-
      Distinguishes significant relics (the body, notable parts, or ashes) from
      non-significant relics (small fragments and objects that touched the person).
      Public veneration requires a certificate of authenticity. Commerce and sale are
      prohibited.
  - source_type: canon-law
    reference: CIC 1186, 1190
    url: >-
      https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib4-cann1166-1190_en.html
    note: >-
      Veneration of the saints; it is absolutely forbidden to sell sacred relics.
      Relics of great significance may not be alienated without Apostolic See permission.
