summary: >-
  The Catholic Church does not teach that every non-Catholic person is automatically damned.
  She teaches that Christ is the unique Savior and that the Church is necessary for salvation,
  while also teaching that those who through no fault of their own do not know the Gospel
  or the Church, yet seek God sincerely and follow the grace given them, may attain salvation.
  This is not indifferentism: the Church still has the duty to evangelize.
