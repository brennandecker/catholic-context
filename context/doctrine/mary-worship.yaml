summary: >-
  The Catholic Church does not worship Mary. Worship, or latria, is due to God alone. Mary
  is honored with a unique veneration, traditionally called hyperdulia, because of her unique
  role as Mother of God. This honor is relative to Christ and must never be confused with
  the adoration given to the Trinity.
