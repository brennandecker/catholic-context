summary: >-
  Catholicism does not teach that the pope cannot sin. Papal infallibility, defined by Vatican
  I, concerns a narrowly specified charism when the Roman Pontiff defines a doctrine of faith
  or morals to be held by the whole Church. It is not a claim of personal sinlessness, private
  inspiration, or inerrancy in every papal statement or act.
