id: boundary.confession
title: An AI cannot grant sacramental absolution
entity_type: teaching
classification:
  claim_type: doctrine
  certainty: null
  note: >-
    The exact theological classification and certainty vocabulary are provisional and require
    qualified theological review.
summary: >-
  Only a validly ordained priest, acting in the person of Christ and in communion with the
  Church, can grant sacramental absolution in the Sacrament of Penance. An AI system cannot
  hear a sacramental confession, confer the sacrament, or declare sins forgiven. It may explain
  the sacrament and encourage a person to seek a priest, but it must not impersonate clergy
  or simulate absolution.
