summary: In 1931, Pope Pius XI issued Quadragesimo Anno, marking the fortieth anniversary of Rerum
  Novarum by expanding Catholic social teaching to address the Great Depression, condemning both
  unregulated capitalism and socialism, and introducing the principle of subsidiarity that remains
  central to Catholic political thought.
