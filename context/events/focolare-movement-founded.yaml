summary: In 1943, amid Allied bombing raids on the Italian city of Trent, a young schoolteacher
  named Chiara Lubich and her companions began living a radical commitment to Christian unity and
  love, founding a movement that would grow into one of the most ecumenical organizations in the
  Catholic Church.
