id: event.seven-sacraments-formally-defined
title: Formal Definition of the Seven Sacraments
entity_type: event
classification:
  claim_type: historical-claim
  certainty: not-applicable
  note: null
summary: At the Second Council of Lyon in 1274 and the Council of Florence in 1439, the Church
  formally defined the number of sacraments as seven — Baptism, Confirmation, Eucharist, Penance,
  Anointing of the Sick, Holy Orders, and Matrimony — settling a question that had been debated for
  centuries.
