summary: In 1830, the French priest Félicité de Lamennais launched L'Avenir, one of the first
  Catholic newspapers, advocating for religious freedom, separation of church and state, and
  democratic rights — ideas that were condemned in his lifetime but largely adopted by the Church a
  century later.
