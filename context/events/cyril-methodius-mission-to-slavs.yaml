summary: In 863, two Greek brothers from Thessalonica — Cyril and Methodius — were sent to Moravia
  to preach the Gospel in the language of the people, creating a new alphabet and translating the
  liturgy into Slavonic, laying the foundation for Christianity across Eastern Europe.
