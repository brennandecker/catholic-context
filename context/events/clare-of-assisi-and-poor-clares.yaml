summary: In 1212, the eighteen-year-old Clare of Assisi left her wealthy family to follow Francis of
  Assisi's radical call to poverty, eventually founding the Order of Poor Ladies — later called the
  Poor Clares — the first religious order for women to receive its own written rule authored by a
  woman.
