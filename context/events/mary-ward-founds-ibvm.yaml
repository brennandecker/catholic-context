summary: In 1609, the English recusant Mary Ward founded a religious institute for women modeled on
  the Jesuits, with no enclosure, no choir obligation, and a mission to educate girls — a vision so
  radical that the Vatican suppressed it in her lifetime, only to see it vindicated centuries later.
