summary: In March 1937, Pope Pius XI issued Mit Brennender Sorge ('With Burning Concern'), an
  encyclical smuggled into Germany and read from Catholic pulpits on Palm Sunday, condemning Nazi
  racial ideology and the German government's systematic violations of its concordat with the
  Church.
