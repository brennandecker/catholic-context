summary: Around 165 AD, Justin, a philosopher who had converted to Christianity and become its most
  articulate early defender, was beheaded in Rome along with six companions after refusing to
  sacrifice to the Roman gods, leaving behind writings that shaped how the Church explained its
  faith to the outside world.
