summary: In 1963, Pope John XXIII issued Pacem in Terris just months before his death, becoming the
  first pope to address an encyclical not just to Catholics but to 'all people of good will,' laying
  out a vision of peace based on human rights, international cooperation, and the dignity of every
  person during the most dangerous moment of the Cold War.
