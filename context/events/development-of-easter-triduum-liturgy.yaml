summary: During the fourth century, the Church in Jerusalem and across the Roman world developed the
  Easter Triduum — the three-day liturgical celebration of Holy Thursday, Good Friday, and the
  Easter Vigil — into the structured form that remains the high point of the Catholic liturgical
  year.
