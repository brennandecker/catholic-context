summary: In 1943, Pope Pius XII issued Divino Afflante Spiritu, an encyclical that encouraged
  Catholic scholars to use modern historical and literary methods to study the Bible, effectively
  reversing decades of suspicion toward critical scholarship and launching a new era of Catholic
  biblical studies.
