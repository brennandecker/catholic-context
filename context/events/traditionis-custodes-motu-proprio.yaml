summary: In 2021, Pope Francis issued Traditionis Custodes, sharply restricting the use of the
  pre-Vatican II Latin Mass that Benedict XVI had liberalized in 2007, asserting that the
  post-conciliar liturgy is the sole expression of the Roman Rite and reigniting one of the most
  heated internal debates in the contemporary Church.
