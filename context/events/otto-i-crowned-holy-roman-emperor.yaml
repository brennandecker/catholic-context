summary: In 962, Pope John XII crowned the German king Otto I as Holy Roman Emperor in Rome,
  reviving the imperial title that had been dormant in the West and creating the political framework
  that would bind the papacy and the German monarchy together — often uncomfortably — for over eight
  centuries.
