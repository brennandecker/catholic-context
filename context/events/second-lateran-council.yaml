summary: In 1139, Pope Innocent II convened the Second Lateran Council to heal the schism caused by
  the antipope Anacletus II and to enact thirty canons reforming Church discipline, including the
  definitive requirement of clerical celibacy that remains in effect in the Latin Church today.
