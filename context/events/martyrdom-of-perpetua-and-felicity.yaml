summary: In 203 AD, Vibia Perpetua, a young noblewoman, and Felicity, her pregnant slave, were
  executed in the arena at Carthage during the persecution under Emperor Septimius Severus, leaving
  behind one of the earliest and most vivid first-person accounts of Christian martyrdom.
