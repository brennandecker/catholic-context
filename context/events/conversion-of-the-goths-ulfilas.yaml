summary: Around 340, the bishop Ulfilas began his mission to the Gothic peoples north of the Danube,
  translating the Bible into Gothic and creating an alphabet to do it — the first time Scripture was
  rendered in a Germanic language — launching the Christianization of the barbarian nations that
  would reshape Europe.
