summary: In 1820, Father John Joseph Therry and Father Philip Conolly arrived in Sydney as the first
  officially appointed Catholic chaplains in Australia, establishing regular parish life for the
  thousands of Irish Catholic convicts and settlers who had been without priests for decades.
