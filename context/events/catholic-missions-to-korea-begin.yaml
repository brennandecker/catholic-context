summary: In 1784, the Korean scholar Yi Seung-hun was baptized in Beijing and returned home to
  establish a Catholic community in Korea — the only country in the world where the Catholic faith
  was introduced not by foreign missionaries but by its own people seeking truth on their own
  initiative.
