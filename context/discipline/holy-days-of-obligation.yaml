# Source-linked paraphrase of CIC cann. 1246-1247 and CCC 2177, 2180
id: discipline.holy-days-of-obligation
title: Holy Days of Obligation
entity_type: practice
classification:
  claim_type: discipline
  certainty: authoritatively-taught
  note: The universal list and Mass obligation are set in canon law and the Catechism. Which
    particular holy days bind in a given country may be modified by the conference of bishops
    with prior approval of the Apostolic See (can. 1246 §2).
summary: 'Sunday must be observed in the universal Church as the primordial holy day of obligation.
  The following days must also be observed: the Nativity of our Lord Jesus Christ, the Epiphany,
  the Ascension, the Body and Blood of Christ, Holy Mary the Mother of God, her Immaculate
  Conception, her Assumption, Saint Joseph, Saint Peter and Saint Paul the Apostles, and All
  Saints. With prior approval of the Apostolic See, the conference of bishops can suppress
  some of these holy days or transfer them to a Sunday. On Sundays and other holy days of
  obligation, the faithful are obliged to participate in the Mass and to abstain from works
  and affairs which hinder the worship owed to God, the joy proper to the Lord’s day, or suitable
  rest of mind and body.'
