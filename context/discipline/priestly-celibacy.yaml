summary: >-
  Priestly celibacy in the Latin Church is a disciplinary law of great spiritual value, not
  a dogma. The Church has authority to bind Latin-rite candidates for the priesthood to celibacy
  while recognizing that married priests exist in Eastern Catholic Churches and, in limited
  cases, in the Latin Church. Calling celibacy a dogma confuses a changeable ecclesiastical
  discipline with revealed doctrine.
